<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Invaders — Retro Arcade Web Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: radial-gradient(circle at center, #0b0f19 0%, #03060c 100%);
            color: #f1f5f9;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }
        header {
            text-align: center;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #fbbf24, #f87171, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-top: 4px;
        }
        .canvas-container {
            position: relative;
            background: #000;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(99, 102, 241, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 900px;
            height: 700px;
            max-width: 95vw;
            max-height: 80vh;
        }
        canvas.emscripten {
            border: 0px none;
            background-color: black;
            width: 100%;
            height: 100%;
            outline: none;
            display: block;
        }
        .controls-card {
            margin-top: 18px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 12px 24px;
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: 0.9rem;
            color: #cbd5e1;
        }
        .controls-card span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .kbd {
            background: #334155;
            color: #f8fafc;
            padding: 2px 8px;
            border-radius: 5px;
            font-size: 0.8rem;
            font-weight: 600;
            border-bottom: 2px solid #1e293b;
            font-family: monospace;
        }
        .status-spinner {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: #cbd5e1;
            font-weight: 500;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <header>
        <h1>Chicken Invaders 🐔🛸</h1>
        <p class="subtitle">Computer Graphics Module Project — C++ / OpenGL to WebAssembly</p>
    </header>

    <div class="canvas-container">
        <div id="loadingStatus" class="status-spinner">
            <div class="spinner"></div>
            <div>Loading WebAssembly Engine...</div>
        </div>
        <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    </div>

    <div class="controls-card">
        <span><span class="kbd">A</span> / <span class="kbd">D</span> or <span class="kbd">◀</span> <span class="kbd">▶</span> Move</span>
        <span><span class="kbd">SPACE</span> Shoot</span>
        <span><span class="kbd">P</span> Pause</span>
        <span><span class="kbd">ENTER</span> Start Game</span>
    </div>

    <script type='text/javascript'>
        var loadingStatus = document.getElementById('loadingStatus');
        var canvasElement = document.getElementById('canvas');

        var Module = {
            preRun: [],
            postRun: [function() {
                if (loadingStatus) loadingStatus.style.display = 'none';
                canvasElement.focus();
            }],
            print: function(text) {
                console.log(text);
            },
            printErr: function(text) {
                console.error(text);
            },
            canvas: (function() {
                canvasElement.addEventListener("webglcontextlost", function(e) {
                    alert('WebGL context lost. Please reload the page.');
                    e.preventDefault();
                }, false);
                return canvasElement;
            })(),
            setStatus: function(text) {
                if (!text) {
                    if (loadingStatus) loadingStatus.style.display = 'none';
                }
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
            }
        };

        // Ensure canvas gets keyboard focus on click
        canvasElement.addEventListener('click', function() {
            canvasElement.focus();
        });
    </script>
    {{{ SCRIPT }}}
</body>
</html>
